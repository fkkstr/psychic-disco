<!DOCTYPE html>
<html lang="pt-br" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="FOLKKSTAR - HOME">
  <title>FOLKKSTAR</title>
  
  <link rel="icon" href="/favicon.ico" type="image/x-icon">
  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">
  <link rel="manifest" href="/site.webmanifest">
  <link rel="stylesheet" href="css/style.css">

  <script>
    (function(){
      try {
        const t = localStorage.getItem('theme');
        if (t) document.documentElement.setAttribute('data-theme', t);
      } catch(e) {}
    })();
  </script>

  <style>
    body {
      visibility: hidden !important;
      opacity: 0 !important;
    }

    body.spa-ready {
      visibility: visible !important;
      opacity: 1 !important;
      transition: opacity 200ms ease-out;
    }

    .loading-overlay {
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background: var(--bg-color, #fff);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 9999;
      color: var(--text-color, #000);
      font-family: 'JetBrains Mono', monospace;
    }

    body.spa-ready .loading-overlay {
      display: none;
    }

    .loading-dot {
      animation: loading-pulse 1.5s ease-in-out infinite;
    }

    @keyframes loading-pulse {
      0%, 100% { opacity: 0.3; }
      50% { opacity: 1; }
    }
  </style>
</head>
<body>
  <div class="loading-overlay">
    <span class="loading-dot">●</span>
  </div>

  <header id="main-header">
    <button id="theme-toggle-button" aria-label="Alternar tema" title="Alternar tema">★</button>

    <a href="/" class="logo-home-link spa-link" aria-label="Página Inicial FOLKKSTAR">
      <img src="images/fs-logo.png" alt="FOLKKSTAR Logo" class="logo-image">
    </a>

    <div class="main-navigation-container">
      <nav id="main-navigation" class="navigation" aria-label="Navegação principal">
        <ul>
          <li>
            <div class="dropdown" data-dropdown>
              <button id="collections-dropbtn" class="dropbtn" aria-haspopup="true" aria-expanded="false">
               ARTE
                <svg class="dropdown-arrow" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="6 8 12 14 18 8"></polyline></svg>
              </button>

              <div id="collectionsDropdown" class="dropdown-content" role="menu">
                <a href="/colecao-1" class="spa-link" data-path="colecao-1" role="menuitem">
                  <span class="item-name">Coleção 1</span>
                  <span class="item-year">2020</span>
                </a>
                <a href="/ghost-hardware" class="spa-link" data-path="ghost-hardware" role="menuitem">
                  <span class="item-name">Ghost Hardware</span>
                  <span class="item-year">2021</span>
                </a>
                <a href="/death-deluxe" class="spa-link" data-path="death-deluxe" role="menuitem">
                  <span class="item-name">Death Deluxe</span>
                  <span class="item-year">em breve</span>
                </a>
                <hr class="dropdown-separator">
                <a href="/arquivo" class="spa-link extra-page" data-path="arquivo" role="menuitem">
                  <span class="item-name">Arquivo</span>
                  <span class="item-year">2019-2025</span>
                </a>
              </div>
            </div>
          </li>
          <li><a href="/playlist" class="spa-link" data-path="playlist">CD MIX</a></li>
          <li><a href="/sobre" class="spa-link" data-path="sobre">SOBRE</a></li>
        </ul>
      </nav>
    </div>
  </header>

  <main id="main-content" aria-live="polite" role="main">
    <div class="image-container">
      <img src="images/arquivo/babybaby.jpg" alt="Baby Baby" class="image-container">
    </div>
  </main>

  <script type="module" src="js/main.js"></script>
</body>
</html>
